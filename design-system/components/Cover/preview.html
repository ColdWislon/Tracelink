<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Trace</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--accent); }
  .deep { fill:var(--ink); }
  .tint { fill:var(--rule); }
  .blk { rx:var(--radius-md); }
  .dot-ok { fill:var(--ok); }
  .dot-pl { fill:var(--accent); }
  .dot-gap { fill:var(--gap); }
  .dot-fail { fill:var(--danger); }
  .dot-tr { fill:none; stroke:var(--ink-muted); stroke-width:1.5; }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.025em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 120×240 bled off the top (the identity hue, the IDs) · ink 112×184 bleeding off the right edge · rule tint 168×168 carrying the dots — about 30% of 960×288
  arrangement one tall accent slab, the tint field beside it, the ink slab bleeding right; bottoms on one line space-6 above the edge, space-4 gutters
  pattern     a dot grid, from "chaque exigence est précédée de sa pastille de statut": 6×6 status dots at a space-6 pitch over the tint, mostly ok, a few accent, one danger, one gap, one hollow tracée ring — the coverage meter
  scales      sides in space-2 multiples; gutters space-4; pitch space-6; corners radius-md; dots 10px
-->
<rect class="brand blk" x="16" y="-16" width="120" height="256" rx="6"/>
<rect class="tint blk" x="152" y="72" width="168" height="168" rx="6"/>
<rect class="deep blk" x="336" y="56" width="160" height="184" rx="6"/>
<g>
<circle class="dot-ok" cx="176" cy="96" r="5"/><circle class="dot-ok" cx="200" cy="96" r="5"/><circle class="dot-ok" cx="224" cy="96" r="5"/><circle class="dot-pl" cx="248" cy="96" r="5"/><circle class="dot-ok" cx="272" cy="96" r="5"/><circle class="dot-ok" cx="296" cy="96" r="5"/>
<circle class="dot-ok" cx="176" cy="120" r="5"/><circle class="dot-ok" cx="200" cy="120" r="5"/><circle class="dot-pl" cx="224" cy="120" r="5"/><circle class="dot-ok" cx="248" cy="120" r="5"/><circle class="dot-ok" cx="272" cy="120" r="5"/><circle class="dot-ok" cx="296" cy="120" r="5"/>
<circle class="dot-ok" cx="176" cy="144" r="5"/><circle class="dot-fail" cx="200" cy="144" r="5"/><circle class="dot-ok" cx="224" cy="144" r="5"/><circle class="dot-ok" cx="248" cy="144" r="5"/><circle class="dot-ok" cx="272" cy="144" r="5"/><circle class="dot-pl" cx="296" cy="144" r="5"/>
<circle class="dot-ok" cx="176" cy="168" r="5"/><circle class="dot-ok" cx="200" cy="168" r="5"/><circle class="dot-ok" cx="224" cy="168" r="5"/><circle class="dot-tr" cx="248" cy="168" r="4.25"/><circle class="dot-ok" cx="272" cy="168" r="5"/><circle class="dot-ok" cx="296" cy="168" r="5"/>
<circle class="dot-ok" cx="176" cy="192" r="5"/><circle class="dot-ok" cx="200" cy="192" r="5"/><circle class="dot-ok" cx="224" cy="192" r="5"/><circle class="dot-ok" cx="248" cy="192" r="5"/><circle class="dot-gap" cx="272" cy="192" r="5"/><circle class="dot-ok" cx="296" cy="192" r="5"/>
<circle class="dot-ok" cx="176" cy="216" r="5"/><circle class="dot-ok" cx="200" cy="216" r="5"/><circle class="dot-pl" cx="224" cy="216" r="5"/><circle class="dot-ok" cx="248" cy="216" r="5"/><circle class="dot-ok" cx="272" cy="216" r="5"/><circle class="dot-ok" cx="296" cy="216" r="5"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Trace</h1>
<p class="tag">De l'exigence client au résultat qui la prouve.</p>
</div>
</div>
</body>
</html>
