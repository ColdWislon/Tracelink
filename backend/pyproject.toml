[project]
name = "tracelink-backend"
version = "0.1.0"
description = "Tracelink backend — requirement tracking for SoC/ASIC verification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "httpx2>=0.28",  # starlette>=1.7 test client prefers httpx2 over httpx
    "ruff>=0.8",
    "mypy>=1.13",
]
# pyslang powers the SystemVerilog catalog scanner. Kept optional so the core
# backend and its tests install without a native build toolchain.
scan = [
    "pyslang>=7.0",
]

[project.scripts]
rtrack-push = "cli.rtrack_push.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "cli", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Seed and test data contain long natural-language requirement statements.
"app/seed.py" = ["E501"]
"tests/domain/test_status.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
# SQLAlchemy declarative attributes and third-party libs without stubs.
ignore_missing_imports = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Seed is heterogeneous literal bootstrap data; element-level tuple typing is noise.
module = ["app.seed"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
